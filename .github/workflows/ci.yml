name: CI

on:
    push:
    pull_request:

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.61.1-noble

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install dependencies
              run: npm ci

            - name: Check
              run: npm run check

            - name: Unit tests
              run: npm test

            - name: Browser tests
              env:
                  HOME: /root
              run: npm run test:e2e

            - name: Build
              run: npm run build
